<div class="header">
    <div class="icon">
        <div class="far fa-project-diagram icon"></div>
    </div>
    <div class="title">Children</div>
</div>
<clark-skip-link
    title="Skip to Builder Form"
    skipLocation="form"></clark-skip-link>
<div
    class="add-child-action"
    [tip]="addChildDisabledReason"
    [tipDisabled]="!addChildDisabledReason"
    tipPosition="right">
    <button
        id="children"
        #addChildButton
        [attr.aria-label]="
            addChildDisabledReason
                ? 'Add Child unavailable. ' + addChildDisabledReason
                : 'Add Child'
        "
        class="edit-children"
        [disabled]="!!addChildDisabledReason"
        (activate)="toggleAddChild(); $event.stopPropagation()">
        Add Child
        <i class="far fa-plus"></i>
    </button>
</div>
<ng-template [ngIf]="children && children.length > 0">
    <div cdkDropList class="children-list" (cdkDropListDropped)="drop($event)">
        <div
            *ngFor="let c of children; let i = index"
            class="child-box"
            cdkDragLockAxis="y"
            cdkDragBoundary=".children-list"
            cdkDrag>
            <div
                tabindex="0"
                attr.aria-label="Move {{ c.name }}"
                class="hamburger-handle"
                cdkDragHandle>
                <i class="fas fa-bars"></i>
            </div>
            <div class="info">
                <div class="top-row">
                    <div class="child-title" [tip]="c.name" tipPosition="top">
                        {{ c.name }}
                    </div>
                </div>
                <div class="bottom-row">
                    <div [ngClass]="c.length" class="child-length">
                        {{ c.length | titlecase }}
                    </div>
                    <div class="child-last-updated">
                        {{ c.date | date: "shortDate" }}
                    </div>
                </div>
            </div>
            <button
                attr.aria-label="Delete {{ c.name }}"
                class="delete"
                (activate)="deleteButton(i)">
                <i class="far fa-trash-alt"></i>
            </button>
        </div>
    </div>
</ng-template>

<ng-template [ngIf]="loading">
    <div class="loading-template">
        <i class="fal fa-spinner-third fa-spin"></i>
        Loading...
    </div>
</ng-template>

<ng-template
    [ngIf]="children?.length === 0 && learningObject?.length !== 'nanomodule'">
    <div class="no-children">This learning object has no children</div>
</ng-template>

<ng-template [ngIf]="learningObject?.length === 'nanomodule'">
    <div class="no-children">Nanomodules cannot have children</div>
</ng-template>

<ng-template [ngIf]="loadingChildrenError">
    <div class="scaffold__error">
        <div class="error__icon">
            <i class="far fa-exclamation-triangle"></i>
        </div>
        Unable to load children. Try again later.
    </div>
</ng-template>

<!-- Children Confirmation Popup -->
<clark-popup
    *ngIf="childrenConfirmation"
    (closed)="toggleConfirmationModal(false)">
    <div #popupInner class="popup-inner">
        <div class="modal-title">Confirm deletion</div>
        <div class="modal-text">{{ childrenConfirmationMessage }}</div>
        <div class="btn-group center">
            <button
                class="button good"
                aria-label="Delete child"
                (activate)="deleteChild()">
                Delete <i class="far fa-check"></i>
            </button>
            <button
                class="button neutral"
                aria-label="Cancel child deletion"
                (activate)="toggleConfirmationModal(false)">
                Cancel <i class="far fa-ban"></i>
            </button>
        </div>
    </div>
</clark-popup>

<clark-teleporter *ngIf="isAddingChild">
    <div
        #teleporterPayload
        class="add-child"
        (activate)="$event.stopPropagation()">
        <clark-add-child
            [currentChildren]="childrenIDs"
            [child]="learningObject"
            (childToAdd)="addToChild($event)"
            (childCreated)="handleCreatedChild($event)"
            (dismissalLockChange)="
                childFlowLocked = $event
            "></clark-add-child>
    </div>
</clark-teleporter>
