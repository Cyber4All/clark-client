<div class="builder-template-columns">
    <div
        #columnWrapper
        class="columns"
        [ngClass]="{
            'no-right': !rightColumn,
            'no-left': !leftColumn,
        }">
        <div *ngIf="leftColumn" class="scroll-wrapper scroll-wrapper--left">
            <div *ngIf="showColumn('l')" class="left-column column">
                <div class="content">
                    <ng-content select="[left]"></ng-content>
                </div>
            </div>
        </div>
        <div class="scroll-wrapper">
            <div *ngIf="showColumn('m')" class="main-column column">
                <div class="content">
                    <ng-content select="[main]"></ng-content>
                </div>
            </div>
        </div>
        <div *ngIf="rightColumn" class="scroll-wrapper scroll-wrapper--right">
            <div *ngIf="showColumn('r')" class="right-column column">
                <div class="content">
                    <ng-content select="[right]"></ng-content>
                </div>
            </div>
        </div>
    </div>
</div>
