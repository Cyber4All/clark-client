<div
    class="agentic-builder-panel"
    role="dialog"
    aria-labelledby="agentic-builder-title">
    <div class="agentic-builder-panel__header">
        <h2 id="agentic-builder-title">Builder Helper</h2>
        <button
            type="button"
            aria-label="Close Builder Helper"
            [disabled]="generating"
            (activate)="close()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <p>Generate learning object content from your selected materials.</p>
    <div class="agentic-builder-panel__fields">
        <label>
            <input
                type="checkbox"
                [checked]="selectedFields.name"
                [disabled]="generating"
                (change)="setField('name', $event)" />
            Name
        </label>
        <label>
            <input
                type="checkbox"
                [checked]="selectedFields.description"
                [disabled]="generating"
                (change)="setField('description', $event)" />
            Description
        </label>
        <label>
            <input
                type="checkbox"
                [checked]="selectedFields.learningOutcomes"
                [disabled]="generating"
                (change)="setField('learningOutcomes', $event)" />
            Learning Outcomes
        </label>
    </div>
    <button
        type="button"
        class="button good"
        [disabled]="generating"
        (activate)="generate()">
        {{ generating ? "Generating..." : "Generate" }}
        <span
            class="agentic-builder-panel__generate-icon"
            [class.agentic-builder-panel__generate-icon--loading]="generating"
            aria-hidden="true"></span>
    </button>
</div>
