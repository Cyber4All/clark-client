<ng-container *ngIf="originalEmpty; else comparison">
    <span>{{ suggested }}</span>
</ng-container>

<ng-template #comparison>
    <span *ngIf="identical">{{ suggested }}</span>
    <ng-container *ngIf="!identical">
        <span
            *ngFor="let segment of expanded ? fullSegments : displaySegments"
            [class.text-diff__added]="segment.added"
            [class.text-diff__removed]="segment.removed"
            [attr.aria-label]="
                segment.added
                    ? 'Added text: ' + segment.value
                    : segment.removed
                      ? 'Removed text: ' + segment.value
                      : null
            "
            >{{ segment.value }}</span
        >
        <button
            *ngIf="hasLongComparison"
            type="button"
            class="text-diff__toggle"
            [attr.aria-expanded]="expanded"
            (click)="toggleExpanded()">
            {{ expanded ? "Show compact comparison" : "Show full comparison" }}
        </button>
    </ng-container>
</ng-template>
