<div class="typeahead">
    <div class="input">
        <div
            #verbElement
            *ngIf="verb"
            class="verb"
            [ngClass]="{ bad: !goodVerb }"
            [attr.aria-disabled]="disabled"
            (activate)="!disabled && goodVerb && toggleMenu(true, $event)">
            {{ verb | titlecase }}
            <span *ngIf="goodVerb">
                <i class="fas fa-angle-down"></i>
            </span>
        </div>
        <input
            [ngClass]="{ withVerb: verb, bad: verb && !goodVerb }"
            placeholder="Outcome text"
            type="text"
            [disabled]="disabled"
            [attr.aria-busy]="disabled"
            (input)="input$.next($event)"
            [value]="text" />
    </div>
    <!--Verb Dropdown Menu-->
    <div *ngIf="menu" class="menu" (activate)="$event.stopPropagation()">
        <ul>
            <li
                *ngFor="let v of verbsInSelectedCategory"
                (activate)="setVerb(v)"
                [ngClass]="{ selected: verb === v }">
                {{ v | titlecase }}
            </li>
        </ul>
    </div>
</div>
