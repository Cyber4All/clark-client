<clark-file-browser
    [currentNode$]="currentNode$"
    [filesystem$]="directoryTree$"
    [folderMeta$]="folderMeta$"
    (meatballClick)="openFileOptions($event)"
    (newOptionsClick)="openNewOptions($event)"
    (path)="emitPath($event)"
    canManage="true"
    (packageableToggled)="packageableToggled.emit($event)"
    [inBuilder]="true"></clark-file-browser>

<clark-context-menu
    *ngIf="showNewOptions"
    [anchor]="menuAnchor"
    (close)="closeContextMenu()">
    <ul #contextMenu>
        <li (activate)="openFileDialog()">
            <i class="fas fa-file"></i> New File
        </li>
        <li (activate)="openFolderDialog()">
            <i class="fas fa-folder"></i> New Folder
        </li>
    </ul>
</clark-context-menu>

<clark-context-menu
    *ngIf="showFileOptions"
    [anchor]="menuAnchor"
    (close)="closeContextMenu()">
    <ul #contextMenu>
        <li (activate)="openOperation('rename')">
            <i class="far fa-edit"></i>Rename
        </li>
        <li *ngIf="!isDirectory(menuItem)" (activate)="openOperation('move')">
            <i class="far fa-folder-open"></i>Move
        </li>
        <li (activate)="triggerDelete(menuItem)" class="bad">
            <i class="far fa-trash-alt"></i>Delete
        </li>
    </ul>
</clark-context-menu>

<clark-popup *ngIf="operation" (closed)="cancelOperation()">
    <form
        #popupInner
        class="file-operation-dialog"
        (submit)="submitOperation($event)">
        <h2>
            {{ operation === "rename" ? "Rename" : "Move" }}
            {{ isDirectory(menuItem) ? "folder" : "file" }}
        </h2>
        <label
            [for]="
                operation === 'rename'
                    ? 'material-name'
                    : 'material-destination'
            ">
            {{ operation === "rename" ? "Name" : "Destination folder" }}
        </label>
        <input
            *ngIf="operation === 'rename'"
            id="material-name"
            type="text"
            [formControl]="operationControl"
            [attr.aria-invalid]="operationError ? true : null"
            [disabled]="operationLoading" />
        <select
            *ngIf="operation === 'move'"
            id="material-destination"
            [formControl]="operationControl"
            [disabled]="operationLoading">
            <option *ngFor="let folder of folderDestinations" [value]="folder">
                {{ folder || "Root" }}
            </option>
        </select>
        <p *ngIf="operationError" class="operation-error" role="alert">
            {{ operationError }}
        </p>
        <div class="btn-group center">
            <button
                class="button good"
                type="submit"
                [attr.aria-busy]="operationLoading"
                [disabled]="operationLoading">
                <span
                    *ngIf="operationLoading"
                    class="operation-spinner"
                    aria-hidden="true"></span>
                {{ operation === "rename" ? "Rename" : "Move" }}
            </button>
            <button
                class="button neutral"
                type="button"
                [disabled]="operationLoading"
                (activate)="cancelOperation()">
                Cancel
            </button>
        </div>
    </form>
</clark-popup>
