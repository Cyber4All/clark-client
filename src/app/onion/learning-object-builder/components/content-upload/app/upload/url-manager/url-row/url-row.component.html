<div class="section url-wrap">
    <div class="title-field">
        <input
            aria-label="URL Title"
            placeholder="Title"
            type="text"
            [value]="titleText"
            [(ngModel)]="titleText"
            (input)="updateTitle()"
            required
            #title="ngModel" />
        <div style="color: red" [hidden]="title.valid || title.untouched">
            <div [hidden]="!title.hasError('required')">
                Enter a title.
            </div>
        </div>
    </div>

    <div class="url-field">
        <input
            aria-label="URL"
            placeholder="https://example.com"
            type="text"
            [value]="urlLink"
            [(ngModel)]="urlLink"
            (input)="updateLink()"
            required
            #link="ngModel"
            pattern="https?://.+" />
        <div
            style="color: red"
            [hidden]="link.valid || title.untouched || link.untouched">
            <div [hidden]="!link.hasError('pattern')">
                Include https:// or http://.
            </div>
            <div [hidden]="!link.hasError('required')">
                Enter a valid URL.
            </div>
        </div>
    </div>
</div>
