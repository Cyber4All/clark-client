<div class="container">
    <h1 class="header" tabindex="0">CLARK Usage Statistics</h1>
    <div class="stat-counters">
        <div class="counter-wrapper" *ngFor="let stat of counterStats">
            <div class="stats__icon" [ngClass]="stat.class">
                <i
                    *ngIf="
                        stat?.title === 'Released Learning Objects' ||
                        stat?.title === 'Learning Objects Under Review'
                    "
                    class="far fa-cube"></i>
                <i
                    *ngIf="stat?.title === 'Weekly Downloads'"
                    class="far fa-cloud-download"></i>
                <i *ngIf="stat?.title === 'Users'" class="far fa-users"></i>
                <i
                    *ngIf="stat?.title === 'Affiliated Organizations'"
                    class="far fa-university"></i>
            </div>
            <div class="number">
                <span *ngIf="stat?.value === -1"
                    ><i class="fal fa-spinner-third fa-spin"></i
                ></span>
                <span *ngIf="stat?.value > -1">{{ stat?.value | number }}</span>
            </div>
            <div class="title">
                <span>{{ stat?.title }}</span>
            </div>
        </div>
    </div>
    <div class="charts top">
        <cube-distribution-chart
            [ariaLabel]="outcomeDistributionChartAria"
            class="chart"
            [chart]="outcomeDistributionChart"
            [moreInfoLink]="outcomeLearnMoreLink"
            (chartNotHovered)="
                handleChartNotHovered()
            "></cube-distribution-chart>
        <cube-distribution-chart
            [ariaLabel]="lengthBreakdownChartAria"
            class="chart"
            [chart]="lengthDistributionChart"
            (chartNotHovered)="
                handleChartNotHovered()
            "></cube-distribution-chart>
    </div>
    <div class="charts bottom">
        <clark-top-downloads
            [learningObjects]="learningObjects"
            [loading]="loading"></clark-top-downloads>
    </div>
</div>
