<p *ngIf="loading" role="status">Loading contributions...</p>
<div *ngIf="failed" role="alert">
    <p>Unable to load contributions.</p>
    <button type="button" (click)="retry.emit()">Try again</button>
</div>
<ng-container *ngIf="!loading && !failed">
    <p *ngIf="!learningObjects.length">No contributions yet.</p>
    <clark-learning-object-component
        *ngFor="let learningObject of learningObjects"
        [learningObject]="learningObject"></clark-learning-object-component>
</ng-container>
