<div
    class="new-rating"
    [ngClass]="{ rated: rating.value && activePanel === 1 }">
    <div
        class="stars-wrapper"
        [ngClass]="{ active: activeHover > -1 }"
        (mouseleave)="reset()">
        <div class="empty-stars stars">
            <div
                class="star"
                *ngFor="let item of iterableCount; let i = index"
                [tip]="tips[i]"
                tipPosition="bottom">
                <div (mouseover)="setHover(i)" (activate)="rate(i + 1)">
                    <i class="fal fa-star"></i>
                </div>
            </div>
        </div>
        <div class="full-stars stars">
            <div
                *ngFor="let item of iterableCount; let i = index"
                class="star"
                [ngClass]="{ show: starShouldShow(i) }">
                <i class="fas fa-star"></i>
            </div>
        </div>
    </div>
    <div class="comment-wrapper">
        <div class="rating-editor">
            <div #headingControl class="rating-format">
                <select
                    aria-label="Text style"
                    [ngModel]="selectedHeading"
                    (ngModelChange)="applyHeading($event)">
                    <option value="p">Paragraph</option>
                    <option value="h1">Heading 1</option>
                    <option value="h2">Heading 2</option>
                    <option value="h3">Heading 3</option>
                </select>
            </div>
            <!-- Keep this editor scoped to ratings so the builder's stable editor layout is untouched. -->
            <st-editor
                [ngModel]="rating.comment ?? ''"
                (ngModelChange)="rating.comment = $event"
                [config]="editorConfig"></st-editor>
        </div>
        <div
            class="character-count"
            [class.over-limit]="commentLength > commentLimit">
            {{ commentLength }}/{{ commentLimit }}
        </div>
        <div class="btn-group center">
            <button
                class="button good"
                [disabled]="isSubmitDisabled"
                (activate)="submitRating()">
                Submit <i class="far fa-arrow-right"></i>
            </button>
            <button class="button neutral" (activate)="cancel()">
                Cancel <i class="far fa-ban"></i>
            </button>
        </div>
    </div>
</div>
