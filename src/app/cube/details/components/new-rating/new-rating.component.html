<div
    class="new-rating"
    [ngClass]="{ rated: rating.value && activePanel === 1 }">
    <clark-rating-stars
        [count]="count"
        [rating]="rating.value"
        [interactive]="true"
        [loggedIn]="true"
        [size]="30"
        [starTips]="tips"
        color="blue"
        (selectedRating)="rate($event)">
    </clark-rating-stars>
    <div class="comment-wrapper">
        <clark-rating-editor
            [value]="rating.comment ?? ''"
            (valueChange)="rating.comment = $event"></clark-rating-editor>
        <div
            class="character-count"
            [class.over-limit]="commentLength > commentLimit">
            {{ commentLength }}/{{ commentLimit }}
        </div>
        <div class="btn-group center">
            <button
                class="button good"
                [disabled]="isSubmitDisabled"
                (activate)="submitRating()">
                Submit <i class="far fa-arrow-right"></i>
            </button>
            <button class="button neutral" (activate)="cancel()">
                Cancel <i class="far fa-ban"></i>
            </button>
        </div>
    </div>
</div>
