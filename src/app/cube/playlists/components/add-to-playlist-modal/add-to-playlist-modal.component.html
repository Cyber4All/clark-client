<section class="playlist-modal" aria-labelledby="playlist-modal-title">
    <header>
        <h2 id="playlist-modal-title">Add to playlist</h2>
        <p>Select a playlist to add this learning object to.</p>
    </header>

    <div class="playlist-options" *ngIf="!loading && !loadFailed">
        <label
            class="playlist-option"
            *ngFor="let playlist of playlists"
            [class.selected]="selectedPlaylistId === playlist._id">
            <input
                type="radio"
                [checked]="selectedPlaylistId === playlist._id"
                (click)="
                    $event.preventDefault(); togglePlaylist(playlist._id)
                " />
            <span class="playlist-copy">
                <strong>{{ playlist.name }}</strong>
                <span>
                    {{ playlist.learningObjectCuids.length }} learning object{{
                        playlist.learningObjectCuids.length === 1 ? "" : "s"
                    }}
                </span>
            </span>
            <i class="far fa-layer-group" aria-hidden="true"></i>
        </label>
    </div>

    <p class="playlist-status" *ngIf="loading">Loading playlists...</p>
    <p class="playlist-status" *ngIf="loadFailed">
        We couldn't load your playlists. Please try again.
    </p>
    <p
        class="playlist-status"
        *ngIf="!loading && !loadFailed && !playlists.length">
        No available playlists found.
    </p>

    <footer>
        <button class="button neutral" (click)="closed.emit()">Cancel</button>
        <button
            class="button good"
            [class.disabled]="!selectedPlaylistId || saving"
            [disabled]="!selectedPlaylistId || saving"
            (click)="addToPlaylist()">
            {{ saving ? "Adding..." : "Add to Playlist" }}
        </button>
    </footer>
</section>
