<div class="library-items__pagination-container">
    <button
        class="library-items__pagination-container__arrow-button"
        (activate)="onLeftArrowClick()"
        [disabled]="currentPageNumber === 1"
        [attr.aria-label]="'To page: ' + (currentPageNumber - 1)">
        <i class="far fa-arrow-left"></i>
    </button>

    <span
        class="library-items__pagination-container__page-label"
        aria-live="polite">
        Page {{ currentPageNumber }} of {{ lastPageNumber }}
    </span>

    <button
        class="library-items__pagination-container__arrow-button"
        (activate)="onRightArrowClick()"
        [disabled]="currentPageNumber === lastPageNumber"
        [attr.aria-label]="'To page: ' + (currentPageNumber + 1)">
        <i class="far fa-arrow-right"></i>
    </button>
</div>
