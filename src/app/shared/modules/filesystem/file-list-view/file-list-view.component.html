<div *ngIf="preview">
    <div class="wrapper">
        <div
            class="grid-row header"
            [ngClass]="{
                bundle: checkAccessGroups(),
                parsing: inBuilder,
            }">
            <div>Name</div>
            <div>Size</div>
            <div>Action</div>
            <div *ngIf="inBuilder" class="parsing-heading">
                Parsing
                <span
                    class="icon"
                    tabindex="0"
                    [tip]="parsingToolTip"
                    aria-label="Supported file extensions for parsing">
                    <i class="fas fa-question-circle" aria-hidden="true"></i>
                </span>
            </div>
            <div class="toggle" *ngIf="checkAccessGroups()">
                <p>Include in download</p>
                <div class="icon" [tip]="toggleToolTip" [tipDisabled]="false">
                    <i class="fas fa-question-circle"></i>
                </div>
            </div>
            <div *ngIf="canManage" class="placeholder"></div>
        </div>
        <div *ngFor="let item of directoryListing" class="item">
            <!-- Folder -->
            <clark-folder-list-item
                *ngIf="item.folders"
                class="folder"
                (clicked)="openFolder(item.name)"
                (menuClicked)="handleMenuClicked($event, item)"
                (toggleClicked)="handleToggleClicked($event, item)"
                [inBuilder]="inBuilder"
                [folder]="item"
                [showOptionButton]="canManage"></clark-folder-list-item>

            <!-- File -->
            <clark-file-list-item
                *ngIf="!item.folders"
                class="file"
                (clicked)="openFile(item)"
                (menuClicked)="handleMenuClicked($event, item)"
                (toggleClicked)="handleToggleClicked($event, item)"
                [inBuilder]="inBuilder"
                [file]="item"
                [showOptionButton]="canManage"></clark-file-list-item>
        </div>
    </div>
</div>
<div class="preview" *ngIf="!preview">
    <clark-file-preview [file]="file"></clark-file-preview>
    <button (activate)="returnToFileView()" class="button good">
        Return to file view
    </button>
</div>
