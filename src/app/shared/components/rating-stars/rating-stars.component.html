<div
    class="rating-stars {{ color ? color : '' }}"
    [ngStyle]="styles"
    [tip]="roundedReview + ' out of ' + count"
    [tipDisabled]="!reviewsCount || interactive"
    tipPosition="top">
    <div
        class="stars-wrapper"
        [class.active]="activeHover > -1"
        (mouseleave)="reset()"
        tabindex="0"
        attr.aria-label="Rating: {{ roundedReview }} out of {{ count }} stars">
        <div class="empty-stars">
            <div
                class="empty-star"
                *ngFor="let item of iterableCount; let i = index"
                (mouseover)="setHover(i)"
                (activate)="selectRating(i + 1)">
                <i class="fal fa-star"></i>
            </div>
        </div>
        <div class="full-stars-mask" [ngStyle]="{ width: calculateBarWidth }">
            <div class="full-stars">
                <div class="full-star" *ngFor="let item of iterableCount">
                    <i class="fas fa-star"></i>
                </div>
            </div>
        </div>
    </div>
    <div
        *ngIf="reviewsCount && reviewsCount > 0"
        class="number-reviews"
        tabindex="0"
        attr.aria-label="{{ reviewsCount }} {{
            reviewsCount > 0 ? 'Review' : 'Reviews'
        }} ">
        ({{ reviewsCount }})
    </div>
</div>
