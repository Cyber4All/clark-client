<label
    class="search-input"
    [class.search-input--full-width]="fullWidth"
    [class.search-input--error]="hasError"
    [style.width]="fullWidth ? null : width"
    [attr.aria-label]="ariaLabel || placeholder">
    <mat-icon class="search-input__icon">search</mat-icon>
    <input
        type="text"
        [value]="currentValue"
        [placeholder]="placeholder"
        (input)="onInputChange($event)" />
</label>
